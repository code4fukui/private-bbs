<script type="module">
import { TAI64N } from "https://code4fukui.github.io/TAI64N-es/TAI64N.js";
import { Post } from "./Post.js";
import { PubkeyUser, Coder } from "https://code4fukui.github.io/PubkeyUser/PubkeyUser.js";
import { DateTime } from "https://js.sabae.cc/DateTime.js";
import { InputFilePubkeyUser } from "https://code4fukui.github.io/PubkeyUser/InputFilePubkeyUser.js";
import { downloadFile } from "https://js.sabae.cc/downloadFile.js";

const u = new PubkeyUser();

const params = new URLSearchParams(window.location.search);
const mail = params.get("mail");
const uuid = params.get("uuid");

if (mail && uuid) {
  // 2. アドレスバーから ?token=... を消す
  const url = new URL(window.location.href);
  url.search = ""; // クエリ全削除
  window.history.replaceState(null, "", url.toString());

  await u.fetch("login", { mail, uuid });
}

let data = [];

let lastdt = null;

const show = async () => {
  posts.innerHTML = "";

  const res = await u.fetch("getLatest", lastdt);
  if (typeof res == "string") {
    alert(res);
    return;
  }
  for (const item of res) {
    if (!lastdt) {
      lastdt = item.data.id;
    } else {
      if (item.data.id.localeCompare(lastdt) > 0) {
        lastdt = item.data.id;
      }
    }
  }
  res.forEach(i => data.push(i));
  for (const item of data) {
    if (!item.data.parent) {
      const div = makePost(item);
      posts.appendChild(div);
    }
  }
};

const sendPost = async (body, parent = null, infile = null) => {
  const id = TAI64N.stringify(TAI64N.encode(new Date()));
  
  if (infile && infile.isFilesUploading()) {
    alert("アップロード中です。アップロードが終わってから再度押してください。");
    return;
  }
  const files = infile ? await infile.getFiles() : undefined;
  const data = {
    id,
    parent,
    pubkey: u.pubkey,
    name: "user1",
    body,
    tags: ["test"],
    files,
  };
  const post = Post.create(data, Coder.decode(u.prikey));
  const res = await u.fetch("add", post);
  return res;
};

const getComments = (post) => {
  const com = data.filter(i => post.data.id == i.data.parent);
  com.sort((a, b) => a.data.id.localeCompare(b.data.id));
  return com;
};

const time = (tai64n) => {
  const dt = new DateTime(TAI64N.toDate(TAI64N.parse(tai64n)));
  const now = new DateTime();
  if (dt.day.equals(now.day)) {
    return dt.time.toStringMin();
  } else if (dt.day.year == now.day.year) {
    return dt.day.month + "/" + dt.day.day;
  } else {
    return dt.day.year + "/" + dt.day.month + "/" + dt.day.day;
  }
};

const makePost = (post) => {
  const div = document.createElement("div");
  div.className = "post";
  const div2 = document.createElement("div");
  div2.className = "post-content";
  div.appendChild(div2);
  const st = document.createElement("strong");
  st.textContent = post.data.name;
  //st.textContent = post.data.pubkey.substring(0, 4);
  div2.appendChild(st);
  const txt = document.createTextNode(post.data.body);
  div2.appendChild(txt);
  const dt = document.createElement("span");
  dt.className = "time";
  dt.textContent = time(post.data.id);
  div2.appendChild(dt);
  
  // files
  const appendFiles = (div2, files) => {
    if (files) {
      const divp = document.createElement("div");
      divp.className = "files";
      div2.appendChild(divp);
      for (const file of files) {
        const div = document.createElement("a");
        div.className = "file";
        div.textContent = file.fn;// + " " + file.tid;
        divp.appendChild(div);
        div.onclick = async () => {
          //console.log(file);
          const bin = await u.fetch("download", file);
          return downloadFile(file.fn, bin);
        };
      }
    }
  };
  appendFiles(div2, post.data.files);
  
  // comments
  const com = document.createElement("div");
  com.className = "comments";
  div.appendChild(com);

  const comments = getComments(post);
  for (const item of comments) {
    const divc = document.createElement("div");
    divc.className = "comment";
    const st = document.createElement("strong");
    st.textContent = item.data.name;
    //st.textContent = item.data.pubkey.substring(0, 4);
    divc.appendChild(st);
    const text = document.createTextNode(item.data.body);
    divc.appendChild(text);
    const dt = document.createElement("span");
    dt.className = "time";
    dt.textContent = time(item.data.id);
    divc.appendChild(dt);
    com.appendChild(divc);

    appendFiles(divc, item.data.files);
  }

  // comments form
  const divcs = document.createElement("div");
  divcs.className = "add-comment";
  com.appendChild(divcs);
  const multilinecomment = true;
  let inp = null;
  if (multilinecomment) {
    inp = document.createElement("textarea");
    inp.placeholder = "質問やアイデアをお書きください";
  } else {
    inp = document.createElement("input");
    inp.type = "text";
    inp.placeholder = "質問やアイデアをお書きください";
  }
  divcs.appendChild(inp);

  const infile = new InputFilePubkeyUser(u);
  divcs.appendChild(infile);
  divcs.appendChild(document.createElement("br"));

  const btn = document.createElement("button");
  btn.textContent = "投稿";
  divcs.appendChild(btn);
  btn.onclick = async () => {
    // post comment
    const body = inp.value;
    if (!body) return;
    const parent = post.data.id;
    if (await sendPost(body, parent, infile)) {
      inp.value = "";
      await show();
    }
  };
  return div;
};

if (document.btn_post) {
  btn_post.onclick = async (e) => {
    const body = ta_body.value;
    if (!body) return;
    if (await sendPost(body)) {
      ta_body.value = "";
      await show();
    }
    e.preventDefault();
  };
}

await show();
